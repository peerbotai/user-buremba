apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-store-landing
  labels:
    app: pet-store-landing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pet-store-landing
  template:
    metadata:
      labels:
        app: pet-store-landing
    spec:
      containers:
      - name: pet-store-landing
        image: pet-store-landing
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5