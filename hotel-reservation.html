<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Reservation Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .form-container {
            padding: 40px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
        }

        .form-group.full-width {
            flex: 100%;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .required {
            color: red;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .container {
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hotel Reservation</h1>
            <p>Book your perfect stay with us</p>
        </div>
        
        <div class="form-container">
            <form id="reservationForm">
                <!-- Guest Information -->
                <div class="form-section">
                    <h2 class="section-title">Guest Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name <span class="required">*</span></label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name <span class="required">*</span></label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email Address <span class="required">*</span></label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number <span class="required">*</span></label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                    </div>
                </div>

                <!-- Reservation Details -->
                <div class="form-section">
                    <h2 class="section-title">Reservation Details</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="checkIn">Check-in Date <span class="required">*</span></label>
                            <input type="date" id="checkIn" name="checkIn" required>
                        </div>
                        <div class="form-group">
                            <label for="checkOut">Check-out Date <span class="required">*</span></label>
                            <input type="date" id="checkOut" name="checkOut" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="adults">Number of Adults <span class="required">*</span></label>
                            <select id="adults" name="adults" required>
                                <option value="">Select...</option>
                                <option value="1">1 Adult</option>
                                <option value="2">2 Adults</option>
                                <option value="3">3 Adults</option>
                                <option value="4">4 Adults</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="children">Number of Children</label>
                            <select id="children" name="children">
                                <option value="0">0 Children</option>
                                <option value="1">1 Child</option>
                                <option value="2">2 Children</option>
                                <option value="3">3 Children</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="roomType">Room Type <span class="required">*</span></label>
                            <select id="roomType" name="roomType" required>
                                <option value="">Select Room Type...</option>
                                <option value="standard">Standard Room</option>
                                <option value="deluxe">Deluxe Room</option>
                                <option value="suite">Suite</option>
                                <option value="presidential">Presidential Suite</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="bedType">Bed Preference</label>
                            <select id="bedType" name="bedType">
                                <option value="">No Preference</option>
                                <option value="single">Single Bed</option>
                                <option value="double">Double Bed</option>
                                <option value="queen">Queen Bed</option>
                                <option value="king">King Bed</option>
                                <option value="twin">Twin Beds</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Preferences & Special Requests -->
                <div class="form-section">
                    <h2 class="section-title">Preferences & Special Requests</h2>
                    <div class="form-group">
                        <label>Amenities (Select all that apply)</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="wifi" name="amenities" value="wifi">
                                <label for="wifi">Free WiFi</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="parking" name="amenities" value="parking">
                                <label for="parking">Parking</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="breakfast" name="amenities" value="breakfast">
                                <label for="breakfast">Breakfast Included</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="gym" name="amenities" value="gym">
                                <label for="gym">Gym Access</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="pool" name="amenities" value="pool">
                                <label for="pool">Pool Access</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="spa" name="amenities" value="spa">
                                <label for="spa">Spa Services</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label for="specialRequests">Special Requests or Comments</label>
                        <textarea id="specialRequests" name="specialRequests" placeholder="Please let us know if you have any special requests, dietary requirements, accessibility needs, or other preferences..."></textarea>
                    </div>
                </div>

                <!-- Payment Information -->
                <div class="form-section">
                    <h2 class="section-title">Payment Method</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="paymentMethod">Preferred Payment Method <span class="required">*</span></label>
                            <select id="paymentMethod" name="paymentMethod" required>
                                <option value="">Select Payment Method...</option>
                                <option value="credit">Credit Card</option>
                                <option value="debit">Debit Card</option>
                                <option value="paypal">PayPal</option>
                                <option value="cash">Pay at Hotel</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Complete Reservation</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('reservationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Basic validation
            const checkIn = new Date(document.getElementById('checkIn').value);
            const checkOut = new Date(document.getElementById('checkOut').value);
            const today = new Date();
            
            if (checkIn < today) {
                alert('Check-in date must be today or later');
                return;
            }
            
            if (checkOut <= checkIn) {
                alert('Check-out date must be after check-in date');
                return;
            }
            
            // Collect form data
            const formData = new FormData(this);
            const data = {};
            
            // Handle regular form fields
            for (let [key, value] of formData.entries()) {
                if (data[key]) {
                    if (Array.isArray(data[key])) {
                        data[key].push(value);
                    } else {
                        data[key] = [data[key], value];
                    }
                } else {
                    data[key] = value;
                }
            }
            
            // Handle amenities checkboxes
            const amenities = [];
            document.querySelectorAll('input[name="amenities"]:checked').forEach(cb => {
                amenities.push(cb.value);
            });
            data.amenities = amenities;
            
            console.log('Reservation Data:', data);
            alert('Reservation submitted successfully! (Check console for form data)');
        });
        
        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('checkIn').setAttribute('min', today);
        document.getElementById('checkOut').setAttribute('min', today);
        
        // Update checkout minimum when checkin changes
        document.getElementById('checkIn').addEventListener('change', function() {
            const checkInDate = this.value;
            const checkOutField = document.getElementById('checkOut');
            checkOutField.setAttribute('min', checkInDate);
            
            // Clear checkout if it's before the new checkin
            if (checkOutField.value && checkOutField.value <= checkInDate) {
                checkOutField.value = '';
            }
        });
    </script>
</body>
</html>
